name: alks-go CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  build:
    runs-on: cai-standard-x86-linux
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # Constitution Delivery and Principle II: formatting, vet, and a cgo-free
      # build for every target the Terraform provider releases.
      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go' | grep -v '^vendor/'))"
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: No-cgo cross-build
        run: |
          set -e
          for os in windows linux darwin freebsd; do
            for arch in amd64 386 arm arm64; do
              case "$os/$arch" in darwin/386|darwin/arm) continue ;; esac
              echo "building $os/$arch"
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
            done
          done
